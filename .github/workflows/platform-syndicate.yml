name: Platform Syndication

on:
  schedule:
    - cron: '17 */3 * * *'  # Every 3 hours at :17 (avoids :00/:30 bursts)
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  syndicate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syndicate to Dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          echo "$DEVTO_API_KEY" > .devto-key
          python3 scripts/syndicate_devto.py || true

      - name: Syndicate to Hashnode
        env:
          HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
        run: |
          echo "$HASHNODE_API_KEY" > .hashnode-key
          python3 scripts/syndicate_hashnode.py || true

      - name: Build cross-platform identity (sameAs)
        env:
          DEVTO_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          echo "$DEVTO_KEY" > .devto-key
          python3 scripts/build_sameas.py

      - name: Share new articles to X via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/buffer_social.py new || true

      - name: Syndicate to WordPress.com
        env:
          WP_ACCESS_TOKEN: ${{ secrets.WP_ACCESS_TOKEN }}
        run: python3 scripts/syndicate_wordpress.py || true

      - name: Commit tracking files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add data/hashnode-published.json data/sameas-urls.json data/buffer-shared.json data/wp-published.json
          git diff --staged --quiet || (git commit -m "chore: update syndication tracking" && git pull --rebase && git push)
