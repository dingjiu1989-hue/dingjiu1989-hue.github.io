name: Platform Syndication

on:
  schedule:
    - cron: '17 */3 * * *'  # Every 3 hours at :17 (avoids :00/:30 bursts)
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syndicate to Dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          echo "$DEVTO_API_KEY" > .devto-key
          python3 scripts/syndicate_devto.py

      - name: Syndicate to Hashnode
        env:
          HASHNODE_API_KEY: ${{ secrets.HASHNODE_API_KEY }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
        run: |
          echo "$HASHNODE_API_KEY" > .hashnode-key
          python3 scripts/syndicate_hashnode.py

      - name: Build cross-platform identity (sameAs)
        env:
          DEVTO_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          echo "$DEVTO_KEY" > .devto-key
          python3 scripts/build_sameas.py

      - name: Share new articles to social platforms (X, LinkedIn)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          pip install requests_oauthlib 2>/dev/null || true
          python3 scripts/social_shares.py new || true

      - name: Commit tracking files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add data/hashnode-published.json data/sameas-urls.json
          git diff --staged --quiet || (git commit -m "chore: update syndication tracking" && git push)
