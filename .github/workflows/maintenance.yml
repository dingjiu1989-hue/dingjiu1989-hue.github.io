name: Daily Maintenance

on:
  schedule:
    # 北京时间 8:00 (UTC+8) = 00:00 UTC
    - cron: '0 0 * * *'
    # 北京时间 20:00 (UTC+8) = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:  # allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate daily AI news (EN+CN)
        run: python3 scripts/gen_daily_news.py

      - name: Register new articles
        run: |
          python3 scripts/register_new_articles.py

      - name: Rebuild site (AI-friendly files + sitemap + feeds)
        run: |
          PYTHONPATH=. python3 scripts/gen_en_site.py
          PYTHONPATH=. python3 scripts/gen_ai_friendly.py
          python3 scripts/add_en_seo.py
          python3 scripts/gen_rss.py
          python3 scripts/generate_json_feed.py

      - name: Generate cover images for new articles
        run: |
          pip install Pillow
          python3 scripts/gen_covers.py

      - name: Run maintenance
        run: python3 scripts/maintenance.py

      - name: Ping search engines
        run: python3 scripts/ping_search_engines.py

      - name: Crawler health check
        run: python3 scripts/crawler_health_check.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: daily maintenance — refresh lastmod and stats"
          git pull --rebase
          git push
