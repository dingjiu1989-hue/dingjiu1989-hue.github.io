name: Weekly Audit

on:
  schedule:
    # 每周一北京时间 9:00
    - cron: '0 1 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run weekly audit
        run: python3 scripts/weekly_audit.py

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly-report.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly audit report $(date +%Y-%m-%d)"
            git push
          else
            echo "No changes to report"
          fi
