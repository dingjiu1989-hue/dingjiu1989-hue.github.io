name: AI Analyst Reports

on:
  schedule:
    # Daily at 2:00 UTC = 10:00 Beijing
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      single:
        description: 'Generate for a single company (name)'
        required: false
        type: string
      code:
        description: 'Stock code (with --single)'
        required: false
        type: string
      reset:
        description: 'Reset queue (will regenerate all)'
        required: false
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MCP_URL: ${{ secrets.MCP_URL }}
      MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
      DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check queue status
        run: python3 scripts/gen_ai_report.py --list

      - name: Reset queue (if requested)
        if: inputs.reset == true
        run: python3 scripts/gen_ai_report.py --reset

      - name: Generate single report
        if: inputs.single != ''
        run: |
          python3 scripts/gen_ai_report.py --company "${{ inputs.single }}" --code "${{ inputs.code }}"

      - name: Generate batch of 5 reports
        if: inputs.single == ''
        run: python3 scripts/gen_ai_report.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "ai-analyst-bot"
          git config user.email "ai-analyst-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: add AI analyst reports (batch)"
          git pull --rebase
          git push

      - name: Queue status after generation
        run: python3 scripts/gen_ai_report.py --list
