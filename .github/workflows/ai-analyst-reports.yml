name: AI Analyst Reports

on:
  # schedule:
  #   # Daily at 2:00 UTC = 10:00 Beijing (PAUSED)
  #   - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      company_name:
        description: 'Company name (e.g. 寒武纪)'
        required: false
        type: string
      code:
        description: 'Stock code (e.g. 688256)'
        required: false
        type: string
      reset:
        description: 'Reset queue (will regenerate all)'
        required: false
        type: boolean
        default: false
      fill_cards:
        description: 'Backfill search cards for existing reports'
        required: false
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MCP_URL: ${{ secrets.MCP_URL }}
      MCP_TOKEN: ${{ secrets.MCP_TOKEN }}
      DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check queue status
        run: python3 scripts/gen_ai_report.py --list

      - name: Reset queue (if requested)
        if: inputs.reset == true
        run: python3 scripts/gen_ai_report.py --reset

      - name: Generate single report
        if: inputs.company_name != ''
        run: |
          python3 scripts/gen_ai_report.py --company "${{ inputs.company_name }}" --code "${{ inputs.code }}"

      - name: Generate batch of 5 reports
        if: inputs.company_name == '' && inputs.fill_cards != true
        run: python3 scripts/gen_ai_report.py

      - name: Backfill search cards (all existing reports)
        if: inputs.fill_cards == true
        run: python3 scripts/gen_ai_report.py --fill-cards

      - name: QA audit generated reports
        if: always()
        run: |
          python3 -c "
          import os, sys
          sys.path.insert(0, '.')
          from scripts.gen_ai_report import qa_report

          total = 0
          for f in sorted(os.listdir('ai-analyst')):
              if not f.endswith('-2026.html'):
                  continue
              slug = f.replace('.html', '')
              cn = open(f'ai-analyst/{f}').read()
              en_path = f'en/ai-analyst/{slug}-en.html'
              en = open(en_path).read() if os.path.exists(en_path) else ''
              w = qa_report(cn, en, slug)
              total += len(w)
          print(f'## QA total: {total} warning(s)')
          "

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "ai-analyst-bot"
          git config user.email "ai-analyst-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: add AI analyst reports (batch)"
          git pull --rebase
          git push

      - name: Queue status after generation
        run: python3 scripts/gen_ai_report.py --list
