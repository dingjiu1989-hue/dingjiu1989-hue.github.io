name: Weekly Site Maintenance

on:
  schedule:
    - cron: '23 19 * * 5'  # Saturday 3:23 AM UTC+8 (Friday 19:23 UTC)
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth google-auth-oauthlib requests beautifulsoup4 html2text

      - name: Run maintenance
        env:
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_TOKEN: ${{ secrets.GSC_TOKEN }}
        run: |
          # Restore GSC credentials from secrets
          mkdir -p data
          echo "$GSC_CLIENT_SECRET" > oauth-client.json
          echo "$GSC_TOKEN" > data/gsc-token.json
          python3 scripts/maintain.py

      - name: Track AI crawler activity
        env:
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_TOKEN: ${{ secrets.GSC_TOKEN }}
        run: |
          echo "$GSC_CLIENT_SECRET" > oauth-client.json
          echo "$GSC_TOKEN" > data/gsc-token.json
          python3 scripts/track_crawlers.py

      - name: Submit URLs to IndexNow (Bing/Yandex/Naver)
        run: python3 scripts/indexnow_submit.py diff

      - name: Submit to additional search engines (Google, Internet Archive, Mojeek)
        run: python3 scripts/submit_search_engines.py diff

      - name: Generate JSON Feeds
        run: python3 scripts/generate_json_feed.py

      - name: Generate AI-friendly artifacts
        run: python3 scripts/gen_ai_friendly.py

      - name: Generate README
        run: python3 scripts/gen_readme.py

      - name: Build cross-platform identity (sameAs)
        env:
          DEVTO_KEY: ${{ secrets.DEVTO_KEY }}
        run: |
          echo "$DEVTO_KEY" > .devto-key
          python3 scripts/build_sameas.py

      - name: Share new articles to X via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/buffer_social.py new || true

      - name: Syndicate to WordPress.com
        env:
          WP_ACCESS_TOKEN: ${{ secrets.WP_ACCESS_TOKEN }}
        run: python3 scripts/syndicate_wordpress.py || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add -A
          git diff --staged --quiet || (git commit -m "chore: weekly automated maintenance $(date +%Y-%m-%d)" && git pull --rebase && git push)
