            <div style="background:#e8e8e8;height:6px;width:50%;border-radius:2px;margin-bottom:0.5rem;"></div>

          <div style="background:white;border-radius:6px;padding:1rem;">
            <div style="background:#e8e8e8;height:6px;width:50%;border-radius:2px;margin-bottom:0.5rem;"></div>

  </div>

  <div class="card" data-choice="sidebar-grid" onclick="toggleSelect(this)">

    <div class="card-body">
