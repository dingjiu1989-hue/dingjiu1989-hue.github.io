<!--
  新文章发布清单:
  1. 复制此文件到 <board>/<slug>.html，填好标题/描述/正文
  2. 在 articles.json 对应 board 的 posts 数组里加一条记录
  3. 在 sitemap.xml 加 <url> 条目（含 lastmod + changefreq + priority）
  4. git commit "feat: <article-title>" && git push
-->

<div id="footer-placeholder"></div>
